<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EventHub – Discover Experiences. Create Moments.</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1e1b4b;--mut:#6b7280;--pr:#7c3aed;--ac:#ec4899;--bd:#e9e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b1f;--card:#1a1533;--tx:#ede9fe;--mut:#a5a0c8;--bd:#2d2650}}
:root[data-theme="dark"]{--bg:#0f0b1f;--card:#1a1533;--tx:#ede9fe;--mut:#a5a0c8;--bd:#2d2650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:auto;padding:20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}nav a,nav button.l{font-size:14px;font-weight:600;color:var(--tx);background:none;border:0;cursor:pointer}nav a:hover{color:var(--pr)}
.logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--pr),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}.sp{flex:1}
.btn{background:linear-gradient(90deg,var(--pr),var(--ac));color:#fff!important;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c3aed55}.btn:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}
.b2{background:var(--card);color:var(--tx)!important;border:1px solid var(--bd)}.dg{background:#e11d48}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 2px 10px #7c3aed0d}
.hero{border-radius:28px;padding:64px 24px;text-align:center;background:radial-gradient(circle at 20% 20%,#ec489933,transparent 45%),radial-gradient(circle at 80% 30%,#7c3aed44,transparent 50%),var(--card);border:1px solid var(--bd)}
.hero h1{font-size:clamp(32px,6vw,58px);margin:0;line-height:1.1}.hero h1 span{background:linear-gradient(90deg,var(--pr),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.sb{display:flex;gap:8px;max-width:640px;margin:28px auto 0;background:var(--card);padding:8px;border-radius:16px;border:1px solid var(--bd);flex-wrap:wrap}.sb input,.sb select{border:0;flex:1;min-width:120px}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.ev{display:block;overflow:hidden;padding:0;transition:.25s}.ev:hover{transform:translateY(-5px);box-shadow:0 14px 30px #7c3aed26}
.ban{height:120px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;font-size:38px}.ban small{font-size:12px;background:#fff9;color:#111;padding:3px 10px;border-radius:99px;font-weight:600}
.eb{padding:16px}.eb h3{margin:0 0 8px;font-size:17px}.m{color:var(--mut);font-size:13px;margin:3px 0}
.bd{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block}.ok{background:#d1fae5;color:#065f46}.wa{background:#fef3c7;color:#92400e}.no{background:#ffe4e6;color:#9f1239}.in{background:#ede9fe;color:#5b21b6}
.pill{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-weight:600}.pill:hover{background:var(--pr);color:#fff}
h2{margin:36px 0 14px}.two{display:grid;grid-template-columns:240px 1fr;gap:20px}@media(max-width:760px){.two,.det{grid-template-columns:1fr!important}}
.f{display:flex;flex-direction:column;gap:10px}.st{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.st b{font-size:30px;color:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd)}.ov{overflow-x:auto}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--ac))}.det{display:grid;grid-template-columns:1fr 290px;gap:20px}
.tl{border-left:3px solid var(--pr);padding:2px 0 2px 14px;margin:10px 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;display:none}
#np{position:absolute;right:20px;top:54px;width:320px;max-width:90vw;max-height:380px;overflow:auto;display:none;z-index:30}
.qr{display:grid;grid-template-columns:repeat(9,1fr);width:126px;gap:2px;margin:10px auto}.qr i{aspect-ratio:1;background:var(--tx)}.qr i.o{background:transparent}
footer{text-align:center;color:var(--mut);padding:40px 0;font-size:13px}
</style></head><body><nav><div class="w"><a href="#/" class="logo">✦ EventHub</a><a href="#/">Home</a><a href="#/events">Explore Events</a><span class="sp"></span><span id="nv"></span></div><div id="np" class="card"></div></nav>
<main class="w" id="app"></main><div id="toast"></div><footer>© EventHub — Discover Experiences. Create Moments.<br>Powered by a Node.js API and an SQLite database.</footer>
<script>
"use strict";
const CATS={Technology:['💻','#6366f1,#8b5cf6'],Business:['💼','#0ea5e9,#6366f1'],Workshop:['🛠️','#f59e0b,#ef4444'],Hackathon:['⚡','#ec4899,#f97316'],Cultural:['🎭','#14b8a6,#3b82f6'],Startup:['🚀','#a855f7,#ec4899'],Sports:['🏆','#22c55e,#0ea5e9'],Networking:['🤝','#f43f5e,#a855f7']};
const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return 'h'+h};
/* ===== Talks to the real backend (server.js + SQLite). DB is only a read cache of /api/state ===== */
let DB={users:[],events:[],regs:[],notes:[],stats:{events:0,organizers:0,users:0,regs:0},me:null};let tok=null;try{tok=localStorage.getItem('eh_token')}catch(e){}
const fail=m=>{throw new Error(m)};
const me=()=>DB.me;const count=e=>e.count;
const need=(...r)=>{const u=me();if(!u)fail('Please login first');if(r.length&&!r.includes(u.role))fail('You do not have permission');return u};
const call=async(m,p,b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
const setTok=t=>{tok=t;try{t?localStorage.setItem('eh_token',t):localStorage.removeItem('eh_token')}catch(e){}};
async function load(){try{DB=await call('GET','/state')}catch(e){if(tok){setTok(null);try{DB=await call('GET','/state')}catch(x){}}}}
const API={
 register:async f=>setTok((await call('POST','/auth/register',f)).token),
 login:async f=>setTok((await call('POST','/auth/login',f)).token),
 join:id=>call('POST','/events/'+id+'/register'),leave:id=>call('DELETE','/events/'+id+'/register'),
 saveEvent:(f,id)=>id?call('PUT','/events/'+id,f):call('POST','/events',f),
 setStatus:(id,st)=>call('PATCH','/events/'+id+'/status',{status:st}),del:id=>call('DELETE','/events/'+id),toggleUser:id=>call('PATCH','/admin/users/'+id+'/toggle'),
 events(f={}){let l=DB.events.filter(e=>e.status==='PUBLISHED');const q=(f.q||'').toLowerCase();
  if(q)l=l.filter(e=>(e.title+e.desc+e.city).toLowerCase().includes(q));if(f.cat)l=l.filter(e=>e.cat===f.cat);if(f.city)l=l.filter(e=>e.city.toLowerCase().includes(f.city.toLowerCase()));
  if(f.type)l=l.filter(e=>e.type===f.type);if(f.price==='free')l=l.filter(e=>!e.price);if(f.price==='paid')l=l.filter(e=>e.price>0);if(f.avail)l=l.filter(e=>count(e)<e.cap);
  const s={date:(a,b)=>a.date.localeCompare(b.date),pop:(a,b)=>count(b)-count(a),price:(a,b)=>a.price-b.price}[f.sort||'date'];return l.sort(s)},
 recommend(){const u=me();if(!u)return[];const mine=DB.regs.filter(r=>r.user===u.id).map(r=>DB.events.find(e=>e.id===r.ev)).filter(Boolean);const cats=new Set(mine.map(e=>e.cat)),cities=new Set(mine.map(e=>e.city)),have=new Set(mine.map(e=>e.id));
  return DB.events.filter(e=>e.status==='PUBLISHED'&&!have.has(e.id)&&count(e)<e.cap).map(e=>({e,s:(cats.has(e.cat)?3:0)+(cities.has(e.city)?2:0)+(e.date>=iso(0)?1:0)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.e)},
 parts(id){const u=need('ORGANIZER','ADMIN');const e=DB.events.find(x=>x.id===id);if(!e||(e.org!==u.id&&u.role!=='ADMIN'))fail('Not your event');return DB.regs.filter(r=>r.ev===id).map(r=>({...r,u:DB.users.find(x=>x.id===r.user)}))}};

/* ============ 3. FRONTEND ============ */
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const run=async(fn,ok)=>{try{await fn();await load();ok&&toast(ok);route()}catch(e){toast(e.message)}};
const cap=e=>{const p=count(e)/e.cap*100;return p>=100?['Full','no']:p>=95?['Very Limited Seats','no']:p>=80?['Almost Full','wa']:['Seats Available','ok']};
const card=e=>{const [t,c]=cap(e),g=CATS[e.cat]||['🎟️','#7c3aed,#ec4899'];return`<a class="card ev" href="#/event/${e.id}"><div class="ban" style="background:linear-gradient(135deg,${g[1]})"><span>${g[0]}</span><small>${esc(e.cat)}</small></div><div class="eb"><h3>${esc(e.title)}</h3><p class="m">📅 ${e.date} · ${e.start}</p><p class="m">📍 ${esc(e.city)} · ${e.type==='ONLINE'?'Online':'Offline'}</p><p class="m">🎤 ${esc(DB.users.find(u=>u.id===e.org)?.name)}</p><div style="display:flex;justify-content:space-between;margin-top:10px;align-items:center"><b>${e.price?'₹'+e.price:'Free'}</b><span class="bd ${c}">${t}</span></div></div></a>`};
function nav(){const u=me();const n=u?DB.notes.filter(x=>x.user===u.id&&!x.read).length:0;
 $('#nv').innerHTML=u?`<span style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${u.role==='ATTENDEE'?'<a href="#/my">My Events</a>':`<a href="#/${u.role==='ADMIN'?'admin':'org'}">Dashboard</a>`}<button class="l" onclick="bell()">🔔${n?` <span class="bd no">${n}</span>`:''}</button><span class="m">${esc(u.name)} · ${u.role}</span><button class="l" onclick="out()">Logout</button></span>`:`<a href="#/login">Login</a> <a class="btn" href="#/register">Register</a>`}
window.bell=()=>{const u=me(),p=$('#np');if(p.style.display==='block'){p.style.display='none';return}const l=DB.notes.filter(x=>x.user===u.id).slice(0,20);
 p.innerHTML=`<div style="display:flex;justify-content:space-between"><b>Notifications</b><a href="#" onclick="event.preventDefault();call('POST','/notifications/read-all').then(load).then(()=>{nav();$('#np').style.display='none'})" style="color:var(--pr);font-size:13px">Mark all read</a></div>`+(l.length?l.map(x=>`<div class="tl" style="opacity:${x.read?.55:1}"><b style="font-size:14px">${esc(x.title)}</b><div class="m">${esc(x.msg)}</div></div>`).join(''):'<p class="m">Nothing yet.</p>');p.style.display='block'};
window.out=()=>{setTok(null);location.hash='#/';load().then(route)};
const F={};let ROLE_MSG='';
const pages={
home(){const u=me(),ev=API.events({sort:'pop'});const st=[['Events',DB.stats.events],['Organizers',DB.stats.organizers],['Users',DB.stats.users],['Registrations',DB.stats.regs]];const rec=API.recommend();
 return`<section class="hero"><span class="bd in">✦ Smart event discovery</span><h1 style="margin-top:14px">Discover Experiences.<br><span>Create Moments.</span></h1><p class="m" style="font-size:17px">Find, register and manage events across India.</p>
 <form class="sb" onsubmit="event.preventDefault();F.q=this.q.value;F.city=this.c.value;location.hash='#/events'"><input name="q" placeholder="🔍 Search events"><select name="c"><option value="">All locations</option>${['Chennai','Coimbatore','Salem','Bangalore','Hyderabad','Mumbai','Delhi','Online'].map(c=>`<option>${c}</option>`).join('')}</select><button class="btn">Explore Events</button></form></section>
 <div class="st" style="margin-top:18px">${st.map(s=>`<div class="card"><span class="m">${s[0]}</span><br><b>${s[1]}</b></div>`).join('')}</div>
 <h2>Popular Categories</h2><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.entries(CATS).map(([k,v])=>`<span class="pill" onclick="F.cat='${k}';location.hash='#/events'">${v[0]} ${k}</span>`).join('')}</div>
 ${rec.length?`<h2>Recommended For You <span class="bd in">rule-based</span></h2><div class="g">${rec.map(card).join('')}</div>`:''}
 <h2>Trending Events</h2><div class="g">${ev.slice(0,6).map(card).join('')}</div>
 <h2>How EventHub Works</h2><div class="g">${[['🔎','Discover','Filter by city, category, price and seats.'],['🎟️','Register','One click, instant confirmation, no overbooking.'],['📊','Organize','Create events, manage guests, track analytics.']].map(x=>`<div class="card"><div style="font-size:30px">${x[0]}</div><h3>${x[1]}</h3><p class="m">${x[2]}</p></div>`).join('')}</div>
 <div class="hero" style="margin-top:36px;padding:40px"><h2 style="margin:0">Ready to host your own event?</h2><p><a class="btn" href="#/register">Become an organizer</a></p></div>`},
events(){return`<div class="two"><aside class="card f" style="height:fit-content"><b>Filters</b><input placeholder="Search" value="${esc(F.q||'')}" oninput="F.q=this.value;lst()"><select onchange="F.cat=this.value;lst()"><option value="">All categories</option>${Object.keys(CATS).map(c=>`<option ${F.cat===c?'selected':''}>${c}</option>`).join('')}</select><input placeholder="Location" value="${esc(F.city||'')}" oninput="F.city=this.value;lst()"><select onchange="F.type=this.value;lst()"><option value="">Online / Offline</option><option value="ONLINE">Online</option><option value="OFFLINE">Offline</option></select><select onchange="F.price=this.value;lst()"><option value="">Any price</option><option value="free">Free</option><option value="paid">Paid</option></select><label><input type="checkbox" style="width:auto" onchange="F.avail=this.checked;lst()"> Seats available</label><select onchange="F.sort=this.value;lst()"><option value="date">Soonest</option><option value="pop">Popular</option><option value="price">Price</option></select><button class="btn b2" onclick="for(const k in F)delete F[k];route()">Reset</button></aside><div><div id="list"></div></div></div>`},
event(id){const e=DB.events.find(x=>x.id===id);if(!e||(e.status!=='PUBLISHED'&&!(me()&&(me().id===e.org||me().role==='ADMIN'))))return`<div class="card">Event not found. <a href="#/events" style="color:var(--pr)">Back to events</a></div>`;
 const u=me(),r=u&&DB.regs.find(x=>x.ev===id&&x.user===u.id&&x.st==='REGISTERED'),full=count(e)>=e.cap,[t,c]=cap(e),g=CATS[e.cat]||['🎟️','#7c3aed,#ec4899'];const sim=API.events({cat:e.cat}).filter(x=>x.id!==id).slice(0,3);
 return`<div class="card" style="padding:0;overflow:hidden"><div class="ban" style="height:190px;font-size:64px;background:linear-gradient(135deg,${g[1]})"><span>${g[0]}</span><small>${e.status}</small></div></div><h1>${esc(e.title)}</h1><div class="det"><div><p class="m">${esc(e.cat)} · by ${esc(DB.users.find(x=>x.id===e.org)?.name)} · ${e.type}</p><p>${esc(e.desc)}</p><h3>Event Timeline</h3>${e.agenda.map(a=>`<div class="tl"><b>${a[0]}</b> — ${esc(a[1])}</div>`).join('')}${e.link&&r?`<p><a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">Join online</a></p>`:''}</div>
 <aside class="card f" style="height:fit-content"><div>📅 ${e.date} · ${e.start}–${e.end}</div><div>📍 ${esc(e.venue||'')}, ${esc(e.city)}</div><b style="font-size:24px">${e.price?'₹'+e.price:'Free'}</b><div><span class="bd ${c}">${t}</span> ${e.cap-count(e)} of ${e.cap} left</div><div style="background:var(--bd);border-radius:9px"><div class="bar" style="width:${Math.min(100,count(e)/e.cap*100)}%"></div></div>
 ${r?`<div class="card" style="text-align:center"><b>✅ You're registered</b><div class="qr">${[...Array(81)].map((_,i)=>`<i class="${hash(id+i)>'h2'&&((hash(id+i).length+i*7)%3)?'':'o'}"></i>`).join('')}</div><span class="m">Ticket ${id.toUpperCase()}</span></div><button class="btn dg" onclick="run(()=>API.leave('${id}'),'Registration cancelled')">Cancel registration</button>`:`<button class="btn" ${full||e.status!=='PUBLISHED'?'disabled':''} onclick="${u?`run(()=>API.join('${id}'),'You are registered! 🎟️')`:`location.hash='#/login'`}">${full?'Registration Full':'Register'}</button>`}
 <button class="btn b2" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('Link copied')">Share</button></aside></div>${sim.length?`<h2>Similar events</h2><div class="g">${sim.map(card).join('')}</div>`:''}`},
login(){return authForm('login')},register(){return authForm('register')},
my(){const u=need('ATTENDEE'),t=iso(0),rs=DB.regs.filter(r=>r.user===u.id).map(r=>({r,e:DB.events.find(e=>e.id===r.ev)})).filter(x=>x.e);
 const gr=[['Upcoming',rs.filter(x=>x.r.st==='REGISTERED'&&x.e.date>=t)],['Past',rs.filter(x=>x.r.st!=='CANCELLED'&&x.e.date<t)],['Cancelled',rs.filter(x=>x.r.st==='CANCELLED')]];
 return`<h1>My Events</h1>${gr.map(([n,l])=>`<h3>${n} (${l.length})</h3>${l.length?l.map(x=>`<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(x.e.title)}</b><div class="m">${x.e.date} · ${esc(x.e.city)} · <span class="bd in">${x.r.st}</span></div></div><div><a class="btn b2" href="#/event/${x.e.id}">View Event</a> ${n==='Upcoming'?`<button class="btn dg" onclick="confirm('Cancel registration?')&&run(()=>API.leave('${x.e.id}'),'Cancelled')">Cancel</button>`:''}</div></div>`).join(''):'<p class="m">Nothing here yet. <a href="#/events" style="color:var(--pr)">Explore events</a></p>'}`).join('')}`},
org(sub,id){const u=need('ORGANIZER','ADMIN');if(sub==='new'||sub==='edit')return evForm(sub==='edit'?DB.events.find(e=>e.id===id):null);if(sub==='participants')return partsPage(id);
 const my=DB.events.filter(e=>e.org===u.id),regs=my.reduce((a,e)=>a+count(e),0),rev=my.reduce((a,e)=>a+count(e)*e.price,0),mx=Math.max(1,...my.map(count));
 const cc={};my.forEach(e=>cc[e.cat]=(cc[e.cat]||0)+count(e));
 return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1>Organizer Dashboard</h1><a class="btn" href="#/org/new">+ Create Event</a></div><div class="st">${[['Total Events',my.length],['Published',my.filter(e=>e.status==='PUBLISHED').length],['Registrations',regs],['Upcoming',my.filter(e=>e.date>=iso(0)&&e.status==='PUBLISHED').length],['Revenue','₹'+rev]].map(s=>`<div class="card"><span class="m">${s[0]}</span><br><b>${s[1]}</b></div>`).join('')}</div>
 <div class="g" style="margin-top:18px"><div class="card"><h3>Event popularity</h3>${my.map(e=>`<div class="m">${esc(e.title)} (${count(e)})</div><div class="bar" style="width:${count(e)/mx*100}%;min-width:4px;margin-bottom:8px"></div>`).join('')}</div><div class="card"><h3>Registrations by category</h3>${Object.entries(cc).map(([k,v])=>`<div class="m">${k} (${v})</div><div class="bar" style="width:${v/Math.max(1,regs)*100}%;min-width:4px;margin-bottom:8px"></div>`).join('')||'<p class="m">No data yet</p>'}</div></div>
 <h2>My Events</h2><div class="card ov"><table><tr><th>Event</th><th>Date</th><th>Status</th><th>Seats</th><th>Actions</th></tr>${my.map(e=>`<tr><td>${esc(e.title)}</td><td>${e.date}</td><td><span class="bd in">${e.status}</span></td><td>${count(e)}/${e.cap}</td><td style="white-space:nowrap"><a href="#/org/participants/${e.id}">Guests</a> · <a href="#/org/edit/${e.id}">Edit</a> · <a href="#" onclick="event.preventDefault();run(()=>API.setStatus('${e.id}','${e.status==='PUBLISHED'?'DRAFT':'PUBLISHED'}'),'Status updated')">${e.status==='PUBLISHED'?'Unpublish':'Publish'}</a> · <a href="#" onclick="event.preventDefault();confirm('Delete event?')&&run(()=>API.del('${e.id}'),'Deleted')" style="color:#e11d48">Delete</a></td></tr>`).join('')}</table></div>`},
admin(){const u=need('ADMIN'),cc={};DB.events.forEach(e=>cc[e.cat]=(cc[e.cat]||0)+count(e));
 return`<h1>Admin Dashboard</h1><div class="st">${[['Users',DB.users.length],['Organizers',DB.users.filter(x=>x.role==='ORGANIZER').length],['Events',DB.events.length],['Registrations',DB.regs.filter(r=>r.st==='REGISTERED').length],['Active Events',DB.events.filter(e=>e.status==='PUBLISHED').length],['Cancelled',DB.events.filter(e=>e.status==='CANCELLED').length]].map(s=>`<div class="card"><span class="m">${s[0]}</span><br><b>${s[1]}</b></div>`).join('')}</div>
 <div class="card" style="margin-top:18px"><h3>Category popularity</h3>${Object.entries(cc).map(([k,v])=>`<div class="m">${k} (${v})</div><div class="bar" style="width:${v*20}px;max-width:100%;min-width:4px;margin-bottom:8px"></div>`).join('')}</div>
 <h2>Users</h2><div class="card ov"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>${DB.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td><td><span class="bd ${x.active?'ok':'no'}">${x.active?'Active':'Suspended'}</span></td><td><a href="#" onclick="event.preventDefault();confirm('${x.active?'Suspend':'Activate'} this user?')&&run(()=>API.toggleUser('${x.id}'),'User updated')" style="color:var(--pr)">${x.active?'Suspend':'Activate'}</a></td></tr>`).join('')}</table></div>
 <h2>All Events</h2><div class="card ov"><table><tr><th>Event</th><th>Organizer</th><th>Status</th><th>Regs</th><th></th></tr>${DB.events.map(e=>`<tr><td><a href="#/event/${e.id}">${esc(e.title)}</a></td><td>${esc(DB.users.find(x=>x.id===e.org)?.name)}</td><td>${e.status}</td><td>${count(e)}</td><td><a href="#" onclick="event.preventDefault();confirm('Delete this event permanently?')&&run(()=>API.del('${e.id}'),'Event deleted')" style="color:#e11d48">Delete</a></td></tr>`).join('')}</table></div>`}};
window.lst=()=>{const l=API.events(F);$('#list').innerHTML=l.length?`<p class="m">${l.length} events found</p><div class="g">${l.map(card).join('')}</div>`:'<div class="card" style="text-align:center">😕 No events match your filters.</div>'};
function authForm(m){return`<form class="card f" style="max-width:400px;margin:40px auto" onsubmit="event.preventDefault();const d=Object.fromEntries(new FormData(this));const fm=this;(async()=>{try{await API.${m}(d);await load();toast('Welcome!');location.hash=me().role==='ATTENDEE'?'#/events':me().role==='ADMIN'?'#/admin':'#/org';route()}catch(e){fm.querySelector('.er').textContent=e.message}})()"><h2 style="margin:0">${m==='login'?'Login':'Create account'}</h2>${m==='register'?'<input name="name" placeholder="Full name" required><select name="role"><option value="ATTENDEE">Attendee</option><option value="ORGANIZER">Organizer</option></select>':''}<input name="email" type="email" placeholder="Email" required><input name="pw" type="password" placeholder="Password" required><div class="er" style="color:#e11d48;font-size:13px"></div><button class="btn">${m==='login'?'Login':'Register'}</button>${m==='login'?`<div class="card m" style="font-size:12px"><b>Demo (password Password@123)</b><br>admin@eventhub.demo<br>organizer@eventhub.demo<br>attendee@eventhub.demo</div>`:''}</form>`}
function evForm(e){e=e||{status:'DRAFT',type:'OFFLINE',cat:'Technology',start:'10:00',end:'17:00',cap:100,price:0};const v=k=>esc(e[k]??'');
 return`<h1>${e.id?'Edit':'Create'} Event</h1><form class="card f" onsubmit="event.preventDefault();const d=Object.fromEntries(new FormData(this));d.cap=+d.cap;d.price=+d.price;API.saveEvent(d,'${e.id||''}').then(()=>{toast('Event saved');location.hash='#/org'}).catch(x=>toast(x.message))"><input name="title" placeholder="Event title" value="${v('title')}" required><textarea name="desc" rows="4" placeholder="Description" required>${v('desc')}</textarea><select name="cat">${Object.keys(CATS).map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select><select name="type"><option ${e.type==='OFFLINE'?'selected':''}>OFFLINE</option><option ${e.type==='ONLINE'?'selected':''}>ONLINE</option></select><input name="venue" placeholder="Venue" value="${v('venue')}"><input name="city" placeholder="City" value="${v('city')}"><input name="link" placeholder="Meeting link (online events)" value="${v('link')}"><input name="date" type="date" value="${v('date')}" required><div style="display:flex;gap:10px"><input name="start" type="time" value="${v('start')}"><input name="end" type="time" value="${v('end')}"></div><div style="display:flex;gap:10px"><input name="cap" type="number" min="1" placeholder="Capacity" value="${v('cap')}"><input name="price" type="number" min="0" placeholder="Price ₹" value="${v('price')}"></div><select name="status">${['DRAFT','PUBLISHED','CANCELLED','COMPLETED'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn">Save event</button></form>`}
function partsPage(id){let p;try{p=API.parts(id)}catch(x){return`<div class="card">${x.message}</div>`}const e=DB.events.find(x=>x.id===id);
 return`<a href="#/org" style="color:var(--pr)">← Back</a><h1>Participants · ${esc(e.title)}</h1><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="ps" placeholder="Search participants" style="max-width:300px" oninput="document.querySelectorAll('#pt tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(this.value.toLowerCase())?'':'none')"><button class="btn" onclick="csv('${id}')">Export CSV</button></div><div class="card ov" style="margin-top:12px"><table id="pt"><tr><th>Name</th><th>Email</th><th>Registered</th><th>Status</th></tr>${p.map(x=>`<tr data-s="${esc((x.u.name+x.u.email).toLowerCase())}"><td>${esc(x.u.name)}</td><td>${esc(x.u.email)}</td><td>${x.at}</td><td>${x.st}</td></tr>`).join('')||'<tr><td colspan="4">No participants yet.</td></tr>'}</table></div>`}
window.csv=id=>{const p=API.parts(id),t='Name,Email,Registered,Status\n'+p.map(x=>[x.u.name,x.u.email,x.at,x.st].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='participants.csv';a.click()};
function route(){$('#np').style.display='none';const [,a='',b,c]=(location.hash.slice(1)||'/').split('/');nav();
 try{const pg=pages[a||'home'];$('#app').innerHTML=pg?pg(b,c):'<div class="card">Page not found. <a href="#/" style="color:var(--pr)">Go home</a></div>';if(a==='events')lst()}catch(e){$('#app').innerHTML=`<div class="card">${esc(e.message)}. <a href="#/login" style="color:var(--pr)">Login</a></div>`}window.scrollTo(0,0)}
addEventListener('hashchange',()=>load().then(route));load().then(route);
